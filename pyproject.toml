[project]
name = "pyramids-citymodels"
version = "0.4.0"
description = "3D city-model file-format drivers for pyramids: CityGML, CityJSON and more"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = {text = "GNU General Public License v3"}
keywords = ["GIS", "3D city models", "CityGML", "CityJSON", "3D Tiles", "pyramids"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">= 3.11, <4"

# No GDAL dependency: pyramids-core vendors osgeo and `import pyramids` puts it on sys.path;
# CityGML etc. are read through that vendored GDAL.
dependencies = [
    # pyramids-core (imports as `pyramids`). Floor held at 0.77.0, the release built/tested
    # against; dispatch via the `pyramids.vector_drivers` entry-point group lands in 0.72.0 (#19).
    "pyramids-core >=0.77.0",
    "numpy >=2.0.0",
    # Named because flatten.py imports them directly (also arrive transitively via pyramids-core,
    # but a direct importer must declare its own deps).
    "shapely >=2.0.0",
    "geopandas >=1.0.0",
]

[project.optional-dependencies]
# One extra per heavy backend. All three drivers keep `extra = None` so they are always discovered;
# a bare install reads every format with the stdlib + numpy/shapely/geopandas.
#
# `draco` is a runtime-decode extra, NOT a driver gate: reading a `KHR_draco_mesh_compression` tile
# needs DracoPy, so the decode path imports it lazily and raises a clear "install the draco extra"
# error only on a Draco tile — uncompressed tiles always read. DracoPy ships cp311-cp314 wheels for
# win-64/osx-arm64/linux-64, so the extra builds nothing.
draco = ["DracoPy>=2.2.0"]

[dependency-groups]
dev = [
    "nbval >=0.11.0",
    "pre-commit >=3.7.1",
    "pre-commit-hooks >=4.6.0",
    "pytest >=8.2.2",
    "pytest-cov >= 5.0.0",
    "pytest-env>=1.6.0",
    "coverage",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "commitizen>=4.8.4",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "pytest-mock>=3.12.0",
    # Test-only (vendor_data XSD conformance); the writer itself uses stdlib ElementTree.
    "lxml>=5.0.0",
    # ruff = lint + format (replaces black/isort/flake8/pydocstyle). Pin kept in step with the
    # `ruff-pre-commit` rev in .pre-commit-config.yaml.
    "ruff==0.17.2"
]
docs = [
    "mkdocs >=1.5.3",
    "mkdocs-material >=9.5.3",
    "mkdocstrings >=0.24.0",
    "mkdocstrings-python >=1.7.5",
    "mike >=2.1.3",
    "mkdocs-jupyter >=0.25.1",
    "mkdocs-autorefs  >=1.2",
    "mkdocs-macros-plugin  >=1.3.7",
    "mkdocs-table-reader-plugin  >=3.1.0",
    "mkdocs-mermaid2-plugin  >=1.2.1",
    "jupyter-contrib-nbextensions  >=0.7.0",
    "mkdocs-panzoom-plugin",
    "notebook<7.0",
]
notebook = [
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "ipykernel"
]


# One entry point per driver → a `VectorDriver` class. pyramids reads the class attributes without
# constructing it and calls `can_open` to disambiguate shared suffixes (e.g. CityJSON vs GeoJSON);
# the driver is built only on a dispatched read, so its heavy backend import stays inside `read`.
# Group is `pyramids.vector_drivers` (city models are vector features; no city-model-specific group).
[project.entry-points."pyramids.vector_drivers"]
cityjson = "pyramids_citymodels.drivers.cityjson:CityJsonDriver"
citygml = "pyramids_citymodels.drivers.citygml:CityGmlDriver"
3dtiles = "pyramids_citymodels.drivers.threedtiles:ThreeDTilesDriver"


[project.urls]
homepage = "https://github.com/serapeum-org/pyramids-citymodels"
repository = "https://github.com/serapeum-org/pyramids-citymodels"
documentation = "https://serapeum-org.github.io/pyramids-citymodels"
Changelog = "https://github.com/serapeum-org/pyramids-citymodels/blob/main/docs/change-log.md"


[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyramids_citymodels", "pyramids_citymodels.*"]
exclude = ["tests*"]

# No sdist config: setuptools has no pyproject equivalent of MANIFEST.in `prune`. The default sdist
# carries tests/*.py but not tests/data/*, so binary fixtures stay out of the distribution anyway.


[tool.ruff]
line-length = 88
target-version = "py311"  # requires-python floors at 3.11

[tool.ruff.format]
quote-style = "preserve"  # black had skip-string-normalization

[tool.ruff.lint]
# E/F/W (effective flake8 set) + I (isort) + UP (pyupgrade); mirrors parent pyramids.
select = ["E", "F", "W", "I", "UP"]
# Carried from the old flake8 ignore set.
ignore = ["E203", "E226", "E266", "E501", "E701", "E722", "C901", "E741", "E731"]

[tool.ruff.lint.per-file-ignores]
# flake8 didn't lint tests/examples; keep only import-sorting (I) there. Notebooks trip E402.
"tests/**" = ["E", "F", "W", "UP"]
"examples/**" = ["E", "F", "W", "UP"]
"*.ipynb" = ["E402"]

[tool.mypy]
# Typing target 3.12 (not 3.11): numpy's stubs use PEP 695 `type` statements mypy only parses at
# >= 3.12. Runtime 3.11 compatibility is covered by the py311 test leg.
python_version = "3.12"
mypy_path = "src"
packages = ["pyramids_citymodels"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = false
check_untyped_defs = true
# pyramids-core/osgeo ship no stubs; collapse to Any (gradual typing, ADR-0002).
ignore_missing_imports = true
exclude = [
    "tests/",
    "examples/",
    "docs/",
]


[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
changelog_file = "docs/change-log.md"
changelog_incremental = false
update_changelog_on_bump = false
major_version_zero = true       # while < 1.0
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.coverage.run]
# Branch coverage: a driver's format-sniff / geometry branch reads as covered on lines alone while
# only ever taken one way. Set here so every runner (pixi tasks, pre-commit, bare pytest) measures it.
branch = true
source = ["src/pyramids_citymodels"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: mark test as slow (deselect with '-m \"not slow\"')",
    "fast: mark test as fast (deselect with '-m \"not fast\"')",
    # Needs a fetched vendor sample (large/binary, never committed); default run deselects it.
    "vendor_data: test needing a fetched vendor sample file",
    # Needs the optional draco extra (DracoPy) importable; wired into the pixi envs so it runs there.
    "draco: test needing the optional draco extra (DracoPy) importable"
]


[tool.pixi.workspace]
channels = ["conda-forge"]
# macOS baseline raised to 14.0 so pixi takes the prebuilt macosx_14_0_arm64 wheels (pyproj/numpy/
# scipy) instead of building from source. Declared on the platform entry since pixi 0.73 deprecates
# [tool.pixi.system-requirements]. macos-latest runners are >= 14.
platforms = ["win-64", "linux-64", { platform = "osx-arm64", macos = "14.0" }]

[tool.pixi.pypi-dependencies]
# Editable self-install with the `draco` extra, so the decode path is exercised in local runs and CI
# (which installs from pixi.lock). The pip contract is unchanged: a bare `pip install` omits DracoPy.
# No [tool.pixi.dependencies] and no conda gdal — pyramids-core's vendored osgeo is used instead.
pyramids-citymodels = { path = ".", editable = true, extras = ["draco"] }

[tool.pixi.tasks]
main = { cmd = "pytest -vvv --cov=src/pyramids_citymodels -sv -m 'not vendor_data' --cov-report=xml", description = "Run the main test suite" }
test-all = { cmd = "pytest -vvv --cov=src/pyramids_citymodels -sv --cov-report=xml --cov-report=term-missing", description = "Run the whole test suite" }
notebooks = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples", description = "check notebooks" }
mypy = { cmd = "mypy", description = "Run mypy type checking (config in [tool.mypy])" }
build-dist = { cmd = "python -m build", description = "Build sdist and wheel for PyPI" }
publish-pypi = { cmd = "twine upload --non-interactive --repository pypi dist/*", depends-on = ["build-dist"], description = "Build and upload package to PyPI" }
cz-changelog = { cmd = "cz changelog", description = "Generate the changelog with commitizen" }
cz-bump = { cmd = "cz bump", description = "Bump the version with commitizen" }

[tool.pixi.environments]
default = { features = ["py314"], solve-group = "default" }
dev = { features = ["py314", "dev"], solve-group = "default" }
docs = { features = ["py314", "docs"], solve-group = "default" }
py311 = { features = ["py311", "dev"], solve-group = "py311" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }
py313 = { features = ["py313", "dev"], solve-group = "py313" }
py314 = { features = ["py314", "dev"], solve-group = "py314" }


# Interpreter pins (default/dev/docs reuse py314). Without a pin they would float past the
# cp311-cp314 wheels pyramids-core ships and fall back to its osgeo-less sdist — a hard import
# failure; bump when pyramids ships 3.15 wheels. The 3.13/3.14 build glob excludes the free-threaded
# `_cp313t`/`_cp314t` interpreter (no wheel, and lock/install still succeed, so it fails at import).
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = { version = "3.13.*", build = "*_cp313" }
[tool.pixi.feature.py314.dependencies]
python = { version = "3.14.*", build = "*_cp314" }
