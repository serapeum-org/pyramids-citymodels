[project]
name = "pyramids-citymodels"
version = "0.1.0"
description = "3D city-model file-format drivers for pyramids: CityGML, CityJSON and more"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = {text = "GNU General Public License v3"}
keywords = ["GIS", "3D city models", "CityGML", "CityJSON", "3D Tiles", "pyramids"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">= 3.11, <4"

# GDAL is deliberately absent. It is not a dependency of this package: the
# `pyramids-core` wheel vendors its own osgeo bindings and `import pyramids` is
# what puts them on `sys.path` (activate_vendored_osgeo). Nothing here installs
# or pins a separate GDAL. Several city-model formats (CityGML in particular) are
# read through GDAL's own drivers, so that vendored osgeo is exactly what these
# drivers build on.
dependencies = [
    # `pyramids-core` is the PyPI distribution name; the import stays `pyramids`.
    # The floor is 0.70.0 (the first release under that name).
    "pyramids-core >=0.70.0",
    "numpy >=2.0.0",
    # Declared because `flatten.py` imports them directly to build the feature
    # table (shapely geometries, a GeoDataFrame the `FeatureCollection` wraps).
    # They also arrive transitively with `pyramids-core`, but a module here that
    # imports them directly must name them — inheriting a peer's transitive
    # dependency is what breaks when that peer reshuffles its own requirements.
    "shapely >=2.0.0",
    "geopandas >=1.0.0",
]

[project.optional-dependencies]
# One extra per dependency-backed driver family, added when a driver that needs a heavy
# backend lands. The driver names that extra via its `extra` class attribute, and pyramids'
# registry skips the driver silently at discovery when the package is not importable — so a
# bare install stays small and every other driver keeps working.
#
# None is declared: the CityJSON and CityGML drivers parse with only the standard library
# (`json`, `xml.etree`) on top of the shapely/geopandas that `pyramids-core` already brings,
# so both set `extra = None` and a bare install reads both formats. A future backend-requiring
# driver (e.g. 3D Tiles, #16) adds its extra here and sets `extra = "<import-name>"`; the
# registry-side skip of an absent-backend driver is exercised once the core
# `pyramids.vector_drivers` consumer ships (#19).

[dependency-groups]
dev = [
    "nbval >=0.11.0",
    "pre-commit >=3.7.1",
    "pre-commit-hooks >=4.6.0",
    "pytest >=8.2.2",
    "pytest-cov >= 5.0.0",
    "pytest-env>=1.6.0",
    "coverage",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "commitizen>=4.8.4",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "pytest-mock>=3.12.0",
    # ruff replaces black + isort + flake8 + pydocstyle (lint + format in one tool),
    # matching the parent pyramids. Pinned exactly and kept in step with the
    # `ruff-pre-commit` rev in `.pre-commit-config.yaml`, so `pixi run -e dev ruff
    # {check,format}` locally matches byte-for-byte what the hook and CI enforce.
    "ruff==0.17.2"
]
docs = [
    "mkdocs >=1.5.3",
    "mkdocs-material >=9.5.3",
    "mkdocstrings >=0.24.0",
    "mkdocstrings-python >=1.7.5",
    "mike >=2.1.3",
    "mkdocs-jupyter >=0.25.1",
    "mkdocs-autorefs  >=1.2",
    "mkdocs-macros-plugin  >=1.3.7",
    "mkdocs-table-reader-plugin  >=3.1.0",
    "mkdocs-mermaid2-plugin  >=1.2.1",
    "jupyter-contrib-nbextensions  >=0.7.0",
    "mkdocs-panzoom-plugin",
    "notebook<7.0",
]
notebook = [
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "ipykernel"
]


# One entry point per driver, pointing at a `VectorDriver` class (not a function).
# pyramids reads the driver's claims — `name`, `long_name`, `api_version`,
# `suffixes`, `schemes`, `capabilities`, `extra` — as class attributes WITHOUT
# constructing it, and calls its `can_open` classmethod to disambiguate formats that
# share a suffix (e.g. telling CityJSON from GeoJSON for a `.json`). The driver is
# built only when `FeatureCollection.read_file` dispatches a read into it, so the
# module must stay light: the heavy backend import belongs inside `read`, not at
# module top. A driver names any optional dependency via its `extra` attribute; when
# that package is not importable the registry skips the driver SILENTLY at discovery
# (no warning), so a bare install stays useful.
#
# The group is `pyramids.vector_drivers` — the group `FeatureCollection.read_file`
# consults; city models are vector features, so that is the group, not a
# city-model-specific one (pyramids has no such consumer).
[project.entry-points."pyramids.vector_drivers"]
cityjson = "pyramids_citymodels.drivers.cityjson:CityJsonDriver"
citygml = "pyramids_citymodels.drivers.citygml:CityGmlDriver"


[project.urls]
homepage = "https://github.com/serapeum-org/pyramids-citymodels"
repository = "https://github.com/serapeum-org/pyramids-citymodels"
documentation = "https://serapeum-org.github.io/pyramids-citymodels"
Changelog = "https://github.com/serapeum-org/pyramids-citymodels/blob/main/docs/change-log.md"


[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyramids_citymodels", "pyramids_citymodels.*"]
# Belt and braces: `where = ["src"]` already means `tests/` cannot be picked up as a
# package, so this only states the intent for anyone reading the wheel contents.
exclude = ["tests*"]

# No sdist configuration here, and not for want of trying: setuptools offers no
# pyproject.toml equivalent of MANIFEST.in's `prune`, so sdist contents cannot be
# steered from this file. The default sdist carries `tests/*.py` and, importantly, does
# NOT carry `tests/data/*` -- so any binary format fixtures stay out of the distribution
# on their own. A handful of small test modules riding along costs nothing, so there is
# no MANIFEST.in.


[tool.ruff]
line-length = 88
target-version = "py311"  # requires-python floors at 3.11

[tool.ruff.format]
# black had skip-string-normalization = true → preserve existing quotes.
quote-style = "preserve"

[tool.ruff.lint]
# ruff replaces black + isort + flake8 + pydocstyle. The old flake8 `select` named B
# and T4, but flake8-bugbear / flake8-print were never installed, so those were inert
# (the effective set was E/F/W). Add I (isort) and UP (pyupgrade) to fold in what the
# standalone isort config and a pyupgrade pass would do. Mirrors the parent pyramids.
select = ["E", "F", "W", "I", "UP"]
# Carried from the old [tool.flake8].ignore. E704/W503 are dropped: ruff does not
# implement either (both are formatter-owned pycodestyle codes), so there is nothing
# to ignore. E226/E701 match pyramids' set.
ignore = ["E203", "E226", "E266", "E501", "E701", "E722", "C901", "E741", "E731"]

[tool.ruff.lint.per-file-ignores]
# flake8 excluded examples/ and tests/ from linting, and isort ran everywhere; keep the
# migration's lint churn on shipped src/ by dropping E/F/W and UP there (import-sorting I
# still applies). Notebooks legitimately import next to first use and run setup before
# imports, both of which trip E402.
"tests/**" = ["E", "F", "W", "UP"]
"examples/**" = ["E", "F", "W", "UP"]
"*.ipynb" = ["E402"]

[tool.mypy]
# Checker target is 3.12 even though `requires-python` floors at 3.11: numpy's stubs
# ship PEP 695 `type` statements that mypy only parses when the target is >= 3.12 (at
# 3.11 it aborts before checking any source). This widens only the *typing* target;
# actual 3.11 runtime compatibility is covered by the py311 leg of the test matrix.
python_version = "3.12"
mypy_path = "src"
packages = ["pyramids_citymodels"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = false
check_untyped_defs = true
# pyramids-core ships no py.typed, and GDAL's osgeo bindings are untyped; collapse those
# to Any rather than failing on missing stubs. Gradual typing per ADR-0002.
ignore_missing_imports = true
exclude = [
    "tests/",
    "examples/",
    "docs/",
]


[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
changelog_file = "docs/change-log.md"
update_changelog_on_bump = false
major_version_zero = true       # while < 1.0
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.coverage.run]
# Branch coverage, not just line coverage. The two differ exactly where the silent
# failures of a file-format driver live -- a format-sniff or geometry-assembly branch
# that is executed but never taken both ways reads as covered while being untested. Set
# here rather than as a task flag so every runner measures it: the pixi tasks, the
# pre-commit `pytest-check` hook and a bare `pytest` alike.
branch = true
source = ["src/pyramids_citymodels"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: mark test as slow (deselect with '-m \"not slow\"')",
    "fast: mark test as fast (deselect with '-m \"not fast\"')",
    # A test needing a vendor sample file rather than a hand-built fixture. Those
    # files are binary and large, so they are fetched in CI and never committed;
    # the default run deselects them with '-m \"not vendor_data\"'.
    "vendor_data: test needing a fetched vendor sample file"
]


[tool.pixi.workspace]
channels = ["conda-forge"]
# The macOS baseline is raised on osx-arm64 so pixi picks the pre-built wheels
# instead of falling back to sdists. pyproj publishes only `macosx_14_0_arm64`
# for arm64, above the pixi default, so without this it has no wheel to take and
# builds from source — which needs PROJ headers the runner does not have. numpy
# and scipy also ship a `macosx_14_0_arm64` build and quietly drop to an older,
# lower-baseline wheel without it. macos-latest runners are >= 14.
#
# Declared here rather than in a `[tool.pixi.system-requirements]` table: pixi
# 0.73 deprecates that table in favour of virtual packages on the platform entry.
platforms = ["win-64", "linux-64", { platform = "osx-arm64", macos = "14.0" }]

[tool.pixi.pypi-dependencies]
pyramids-citymodels = { path = ".", editable = true }
# The editable self-install is the only entry, and there is no
# [tool.pixi.dependencies] table at all: every environment is built from the
# standard declarations — runtime deps from [project.dependencies], tooling from
# the `dev` / `docs` dependency groups — all resolved from PyPI. Per-driver extras
# are declared for pip users and wired into a pixi environment only when the driver
# that needs one lands, so the lock never carries a dependency nothing imports.
#
# In particular there is no conda `gdal`: the pyramids-core wheel vendors its own
# osgeo and `import pyramids` prepends that directory to `sys.path`, so a conda
# GDAL would be installed and never imported. A conda-forge feedstock build does
# need a real GDAL, but that belongs in the recipe, which takes its run
# requirements from [project.dependencies].

[tool.pixi.tasks]
main = { cmd = "pytest -vvv --cov=src/pyramids_citymodels -sv -m 'not vendor_data' --cov-report=xml", description = "Run the main test suite" }
test-all = { cmd = "pytest -vvv --cov=src/pyramids_citymodels -sv --cov-report=xml --cov-report=term-missing", description = "Run the whole test suite" }
notebooks = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples", description = "check notebooks" }
mypy = { cmd = "mypy", description = "Run mypy type checking (config in [tool.mypy])" }
build-dist = { cmd = "python -m build", description = "Build sdist and wheel for PyPI" }
publish-pypi = { cmd = "twine upload --non-interactive --repository pypi dist/*", depends-on = ["build-dist"], description = "Build and upload package to PyPI" }
cz-changelog = { cmd = "cz changelog", description = "Generate the changelog with commitizen" }
cz-bump = { cmd = "cz bump", description = "Bump the version with commitizen" }

[tool.pixi.environments]
default = { features = ["py314"], solve-group = "default" }
dev = { features = ["py314", "dev"], solve-group = "default" }
docs = { features = ["py314", "docs"], solve-group = "default" }
py311 = { features = ["py311", "dev"], solve-group = "py311" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }
py313 = { features = ["py313", "dev"], solve-group = "py313" }
py314 = { features = ["py314", "dev"], solve-group = "py314" }


# Interpreter pins, one feature per environment in the matrix. `default`, `dev`
# and `docs` reuse `py314` rather than declaring a second 3.14 pin of their own.
# Nothing else constrains them — without a pin their only bound is
# `requires-python = ">= 3.11, <4"`, so they would float to whatever conda-forge
# ships newest. pyramids-core publishes cp311-cp314 wheels only, so once 3.15 is
# out an unpinned re-lock would resolve an interpreter with no wheel and fall
# back to the sdist, which vendors no osgeo — and with no conda GDAL underneath,
# that is a hard import failure. Bump the pin when pyramids ships 3.15 wheels.
# (CI installs from the lock file, so a released 3.15 breaks nothing until
# someone re-locks.)
#
# 3.13 and 3.14 additionally carry a build glob to exclude the free-threaded
# interpreter, whose conda build string ends `_cp313t` / `_cp314t` — the glob
# anchors on the plain suffix, so it matches one and not the other. pyramids
# skips `cp313t` / `cp314t` in cibuildwheel and ships no wheel for either, and
# nothing absorbs that: `pixi lock` and `pixi install` both still succeed in
# that state, so the failure lands at import rather than at resolve time.
#
# 3.11 and 3.12 need no glob — free-threading starts at 3.13, so conda-forge
# publishes no `t` variant to exclude.
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = { version = "3.13.*", build = "*_cp313" }
[tool.pixi.feature.py314.dependencies]
python = { version = "3.14.*", build = "*_cp314" }
